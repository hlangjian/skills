# Portable Agent Team 干净初始化模板。
# mode 使用 nested_native_multi_agent、flat_delegation_fallback 或 sequential_fallback。
# Evidence 是 kind=evidence 的 Artifact，不另设对象。
schemaVersion: portable-agent-team/v0.3.1
mode: nested_native_multi_agent

topology:
  current: secretary_only
  coordinatorStatus: absent
  initialAssessmentOnly: true
  upgradeTriggers: []
  lastEvaluationAt: null

capabilities:
  independentExecutors: available
  taskDelegation: available
  maxDelegationDepth: 2
  independentReviewer: unavailable
  persistentState: available
  stableReferences: available

# null 表示实例化时按 Harness 推荐与允许路由确定，不代表静默换模型。
modelPolicy:
  selectionMode: recommended
  roles:
    secretary: {provider: null, model: null, reasoningEffort: null}
    coordinator: {provider: null, model: null, reasoningEffort: null}
    researcher: {provider: null, model: null, reasoningEffort: null}
    executor: {provider: null, model: null, reasoningEffort: null}
    reviewer: {provider: null, model: null, reasoningEffort: null}

goal: null
unknowns: []
assumptions: []
claims: []
decisions: []
tasks: []
artifacts: []
reviews: []
