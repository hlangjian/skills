    status: approved
    approver: design_group
    approver_type: agent
    source_ref: agent://design-group/review-018
    original_statement: "Independent concept, skeptic, and evolution reviews accept option B within the existing agent design mandate."
    plan_revision: design-v2
    scope:
      - payment/refund
      - order/refund_integration
    conditions:
      - Existing refund behavior remains unchanged.
  - kind: implementation
    status: approved
    approver: design_group
    approver_type: agent
    source_ref: agent://design-group/review-019
    original_statement: "The group authorizes implementation of option B in the two internal modules; public API and schema changes remain forbidden."
    plan_revision: design-v2
    scope:
      - payment/refund
      - order/refund_integration
    conditions:
      - public_api_unchanged
      - database_schema_unchanged
